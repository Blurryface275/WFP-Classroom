name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup PHP 8.2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, xml, curl, zip
          coverage: none

      # 3. Cache vendor supaya CI lebih cepat
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 4. Install dependensi PHP
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 5. Buat .env dari .env.example
      - name: Copy .env file
        run: cp .env.example .env

      # 6. Gunakan SQLite supaya CI tidak perlu MySQL
      - name: Set SQLite database config
        run: |
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_HOST=127.0.0.1/#DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=3306/#DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=laravel/DB_DATABASE=\/tmp\/laravel_test.sqlite/' .env
          sed -i 's/DB_USERNAME=root/#DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=/#DB_PASSWORD=/' .env
          touch /tmp/laravel_test.sqlite

      # 7. Generate app key
      - name: Generate application key
        run: php artisan key:generate

      # 8. Set storage & bootstrap cache permission
      - name: Set directory permissions
        run: |
          chmod -R 775 storage bootstrap/cache

      # 9. Jalankan migrasi
      - name: Run database migrations
        run: php artisan migrate --force

      # 10. Setup Node & build assets (opsional, skip error jika tidak ada)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # 11. Jalankan PHPUnit tests
      - name: Run PHPUnit tests
        run: php artisan test --stop-on-failure
